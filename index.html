<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISMS 持續性教學</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{
  --page:#EEF1F6; --panel:#FFFFFF; --ink:#1B2433; --muted:#5B6678; --line:#D6DCE6; --accent:#2A6FDB;
  /* 舞台（投影片）固定使用亮色色票，與錄製影片一致 */
  --navy:#1F3A5F; --teal:#2A9D8F; --orange:#F4A261; --red:#E76F51; --cream:#FFF8EC; --purple:#7B4BB5;
  --c529:#E76F51; --c530:#F4A261; --c813:#2A9D8F; --c814:#3A86FF; --c86:#8E5BD6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#11151C; --panel:#1A202B; --ink:#E7ECF3; --muted:#9AA6B8; --line:#2C3443; --accent:#6EA2FF; color-scheme:dark; }
}
:root[data-theme="dark"]{ --page:#11151C; --panel:#1A202B; --ink:#E7ECF3; --muted:#9AA6B8; --line:#2C3443; --accent:#6EA2FF; color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;font-weight:500}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
.viewport{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.18);background:#000}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;
  background:var(--cream);
  background-image:radial-gradient(circle at 1px 1px,rgba(31,58,95,.08) 1.5px,transparent 0);background-size:28px 28px;color:#1B2433}

/* ---------- 播放控制（舞台外） ---------- */
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.controls button{font:inherit;font-size:15px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;min-width:44px}
.controls button:hover{border-color:var(--accent)}
.controls button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.controls input[type=range]{flex:1 1 220px;accent-color:var(--accent)}
.controls .time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:96px;text-align:right}
.chapters{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chapters button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:4px 10px;cursor:pointer}
.chapters button.cur{color:var(--ink);border-color:var(--accent)}
.note{color:var(--muted);font-size:13px;margin-top:10px;line-height:1.6}
.startbtn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,25,45,.55);cursor:pointer;z-index:50;border:0;width:100%;font:inherit}
.startbtn span{background:#fff;color:#1F3A5F;font-size:28px;font-weight:900;padding:18px 34px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
body.render .wrap{padding:0;max-width:none}
body.render .viewport{border-radius:0;box-shadow:none;width:1280px;height:720px;aspect-ratio:auto}
body.render .controls,body.render .chapters,body.render .note,body.render .startbtn{display:none}

/* ---------- 舞台框架 ---------- */
.topbar{position:absolute;left:0;right:0;top:0;height:54px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 24px;gap:14px;z-index:5}
.topbar .logo{font-weight:900;letter-spacing:1px;background:#fff;color:var(--navy);border-radius:6px;padding:2px 10px;font-size:15px}
.topbar .chap-label{font-size:20px;font-weight:900}
.topbar .brand{margin-left:auto;font-size:14px;opacity:.8}
.progress{position:absolute;left:0;top:54px;height:5px;background:var(--orange);z-index:6;width:0}
.scene{position:absolute;left:40px;right:40px;top:76px;height:470px;display:none}
.scene.active{display:block}

/* 字幕 */
.sub{position:absolute;left:214px;right:244px;bottom:16px;min-height:104px;background:#fff;border:3px solid var(--navy);border-radius:18px;padding:12px 20px 12px;font-size:24px;line-height:1.45;box-shadow:0 6px 0 rgba(31,58,95,.18);z-index:8;display:flex;flex-direction:column;justify-content:center}
.sub .who{position:absolute;top:-17px;left:18px;font-size:15px;font-weight:900;color:#fff;background:var(--navy);padding:2px 12px;border-radius:999px}
.sub.r{border-color:var(--purple)} .sub.r .who{background:var(--purple);left:auto;right:18px}
.sub.empty{opacity:0}
.sub::after{content:"";position:absolute;bottom:22px;left:-16px;border:10px solid transparent;border-right:14px solid var(--navy)}
.sub.r::after{left:auto;right:-16px;border-right-color:transparent;border-left:14px solid var(--purple)}

/* 角色 */
.char{position:absolute;bottom:0;z-index:9;transform-origin:50% 100%}
#allan{left:-22px;width:262px;height:250px}
#arale{right:-24px;width:280px;height:238px}
.char img{position:absolute;left:0;bottom:0;width:100%;height:100%;display:none;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 3px 4px rgba(0,0,0,.18))}
.char img.on{display:block}
.nameplate{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:900;color:#fff;padding:1px 10px;border-radius:999px;white-space:nowrap;z-index:2}
#allan .nameplate{background:var(--navy);left:55%}
#arale .nameplate{background:var(--purple);left:56%}
.fx{position:absolute;font-size:30px;pointer-events:none;z-index:10}

/* ---------- 共用元件 ---------- */
.pill{display:inline-block;color:#fff;font-weight:900;border-radius:999px;padding:2px 12px;font-size:18px;line-height:1.4}
.pill.big{font-size:34px;padding:4px 20px;border-radius:16px}
.p529{background:var(--c529)}.p530{background:var(--c530)}.p813{background:var(--c813)}.p814{background:var(--c814)}.p86{background:var(--c86)}.pgr{background:#6B7280}
.h2{font-size:34px;font-weight:900;color:var(--navy);margin:6px 0 22px}
.chip{display:inline-block;background:#E8F0FF;color:#1F3A5F;border:2px solid #BFD3F5;border-radius:999px;padding:4px 14px;margin:4px 4px;font-size:20px}
.chip.o{background:#FFF1E2;border-color:#F7C99B}
.chip.g{background:#E3F6F1;border-color:#9ED9CB;color:#145C52}
[data-s]{will-change:transform,opacity}

/* 開場 */
.title-wrap{text-align:center;padding-top:22px}
.kicker{display:inline-block;font-size:22px;color:#fff;background:var(--teal);padding:6px 20px;border-radius:999px}
.mega{font-size:96px;font-weight:900;color:var(--navy);margin:18px 0 10px;letter-spacing:4px;text-shadow:4px 4px 0 rgba(244,162,97,.6)}
.mega .en{font-size:60px;color:var(--teal)}
.ctl-row{display:flex;gap:12px;justify-content:center;margin-bottom:24px}
.ctl-row .pill{font-size:24px;padding:4px 18px}
.three{display:flex;gap:22px;justify-content:center}
.tri{font-size:28px;font-weight:900;padding:14px 26px;border-radius:18px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.tri b{margin-right:8px}
.c1{background:var(--teal)}.c2{background:var(--c814)}.c3{background:var(--red)}

/* 屬性 */
.attr-row{display:flex;gap:16px}
.attr{flex:1;background:#fff;border:3px solid #DCE3EE;border-radius:18px;padding:16px 10px;text-align:center;font-size:23px;font-weight:900;color:var(--navy)}
.attr i{display:block;font-style:normal;font-size:40px;margin-bottom:6px}
.attr small{display:block;font-size:15px;color:#5B6678;font-weight:500;margin-top:6px}
.attr.hot{border-color:var(--orange);background:#FFF3E6;box-shadow:0 0 0 6px rgba(244,162,97,.25)}
.balls{display:flex;gap:18px;justify-content:center;margin-top:34px}
.ball{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE9A8,#F4A261 60%,#E07B2E);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#7A2E00;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.ball small{font-size:14px;color:#5A2600;text-align:center;padding:0 12px;line-height:1.3}

/* 流程圖 */
.flow{position:relative;height:470px}
.fnode{position:absolute;top:30px;width:200px;text-align:center;font-size:24px;font-weight:900;line-height:1.3;color:#1B2433}
.fnode b{display:block;font-size:30px}
.ficon{font-size:44px;margin-bottom:6px}
.n529{left:0}.n530{left:280px}
.farrow{position:absolute;top:112px;height:40px;background:#8FB3EA;color:#fff;font-size:18px;font-weight:900;display:flex;align-items:center;padding-left:12px;clip-path:polygon(0 0,85% 0,100% 50%,85% 100%,0 100%)}
.farrow.green{background:#8BC34A}.farrow.grey{background:#B8BEC8;color:#333}
.a1{left:188px;width:96px}.a2{left:470px;width:96px}.a3{left:745px;width:90px}
.fplan{position:absolute;left:575px;top:0;width:165px;display:flex;flex-direction:column;gap:22px;font-size:19px;text-align:center}
.fplan i{display:block;font-style:normal;font-size:38px}
.fring{position:absolute;top:66px;width:170px;height:170px;border-radius:50%;border:12px solid #E7EDB8;background:#fff;text-align:center;font-size:19px;font-weight:900;display:flex;flex-direction:column;justify-content:center;line-height:1.25}
.fring b{font-size:26px}
.fring .ficon{font-size:38px;margin:0}
.r813{left:835px}.r814{left:1015px}
.fcap{position:absolute;left:880px;top:0;font-size:26px;font-weight:900}
.fcap i{font-style:normal;font-size:36px;margin-right:6px}
.floop{position:absolute;inset:0}
.loop-right{position:absolute;right:-10px;top:190px;width:60px;height:200px;border:26px solid #8FB3EA;border-left:0;border-radius:0 40px 40px 0}
.loop-right span{position:absolute;left:10px;top:60px;font-size:18px;font-weight:900;color:#1F3A5F;line-height:1.2}
.loop-bottom{position:absolute;left:60px;right:40px;top:364px;height:26px;background:#7A7F88;display:flex;align-items:center;justify-content:center}
.loop-bottom span{color:#fff;font-weight:900;font-size:18px;letter-spacing:6px}
.loop-left{position:absolute;left:87px;top:245px;width:26px;height:145px;background:#7A7F88}
.loop-left::before{content:"";position:absolute;left:-17px;top:-30px;border:30px solid transparent;border-bottom:34px solid #7A7F88;border-top:0}

/* 章節卡 */
.chap{margin:40px auto 0;width:760px;border-radius:28px;color:#fff;text-align:center;padding:40px 20px 46px;box-shadow:0 12px 0 rgba(0,0,0,.15)}
.chap-no{font-size:28px;letter-spacing:8px;opacity:.85}
.chap-title{font-size:76px;font-weight:900;margin:8px 0}
.chap-sub{font-size:26px;opacity:.95}

/* 控制頁 */
.ctl-head{display:flex;gap:20px;align-items:center;background:#fff;border-radius:18px;padding:12px 20px;border:2px solid #E0E6EF;margin-bottom:20px}
.ctl-head h2{margin:0;font-size:34px;font-weight:900;color:var(--navy)}
.ctl-head p{margin:4px 0 0;font-size:18px;color:#5B6678}
.bul{list-style:none;padding:0;margin:0}
.bul li{font-size:25px;background:#fff;border-left:8px solid var(--teal);border-radius:10px;padding:10px 16px;margin-bottom:12px;box-shadow:0 3px 0 rgba(0,0,0,.05)}
.bul li i{font-style:normal;margin-right:10px}
.sticker{position:absolute;right:24px;top:22px;background:#FFE066;color:#5A3D00;font-size:24px;font-weight:900;padding:10px 20px;border-radius:14px;transform:rotate(-4deg);box-shadow:0 5px 0 rgba(0,0,0,.12)}
.bia{display:flex;align-items:center;gap:18px;margin:6px 0 18px}
.bia-step{background:#fff;border:3px solid var(--c530);border-radius:16px;padding:10px 22px;font-size:20px;text-align:center}
.bia-step b{display:block;font-size:32px;color:#B85A00}
.bia-arrow{font-size:40px;color:var(--c530)}
.dep,.roles{font-size:22px;margin:10px 0;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.dep-t{font-weight:900;color:#fff;background:var(--navy);border-radius:8px;padding:4px 12px;margin-right:8px}
.policy{font-size:24px;font-weight:900;color:var(--navy);margin-bottom:18px}
.rule32110{display:flex;gap:14px}
.rule32110 .n{flex:1;background:#fff;border:3px solid var(--c813);border-radius:18px;text-align:center;font-size:20px;padding:10px 4px}
.rule32110 .n b{display:block;font-size:56px;color:var(--c813);line-height:1.1}
.quote{margin-top:26px;text-align:center;font-size:32px;font-weight:900;color:var(--navy)}
.quote span{color:var(--red);font-size:40px}
.spof{display:inline-block;font-size:28px;font-weight:900;color:var(--navy);margin-bottom:18px}
.spof .x{background:var(--red);color:#fff;border-radius:10px;padding:2px 12px;margin-right:8px}
.redun{display:flex;gap:16px}
.redun div{flex:1;background:#fff;border:3px solid var(--c814);border-radius:18px;text-align:center;font-size:24px;font-weight:900;padding:14px 4px;color:var(--navy)}
.redun i{display:block;font-style:normal;font-size:46px}
.warnbar{margin-top:22px;background:#FFF0EB;border:3px dashed var(--red);border-radius:14px;padding:12px 18px;font-size:24px;font-weight:900;color:#9B2C12}
.gauges{display:flex;gap:18px}
.gauge{flex:1;text-align:center;font-size:20px;font-weight:900;color:var(--navy)}
.g-bar{height:96px;width:56px;margin:0 auto 6px;background:#E6EAF0;border-radius:12px;position:relative;overflow:hidden}
.g-bar span{position:absolute;left:0;right:0;bottom:0;height:var(--v);background:var(--teal);border-radius:12px}
.g-bar.warn span{background:#F2B33D}.g-bar.hot span{background:var(--red)}
.thr{margin:6px 0 4px;display:flex;gap:12px;justify-content:center;font-size:20px;font-weight:900}
.thr .y{background:#FFF3C9;color:#7A5A00;border-radius:8px;padding:2px 12px}.thr .r{background:#FFE1D9;color:#9B2C12;border-radius:8px;padding:2px 12px}
.trend{font-size:22px;background:#fff;border-radius:12px;padding:6px 16px;margin-top:8px;border-left:8px solid var(--c86)}
.trend.people{border-left-color:var(--red)}

/* 稽核 */
.trail{display:flex;align-items:center;gap:8px;margin:20px 0 40px}
.trail .t{flex:1;background:#fff;border:3px solid var(--c814);border-radius:16px;text-align:center;padding:16px 4px;font-size:18px;color:#5B6678}
.trail .t b{display:block;font-size:24px;color:var(--navy);margin-bottom:4px}
.trail em{font-style:normal;font-size:30px;color:var(--c814)}
.methods{display:flex;gap:18px;justify-content:center}
.methods span{font-size:26px;font-weight:900;background:var(--navy);color:#fff;border-radius:999px;padding:10px 24px}
table.audit{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:20px}
.audit th{background:var(--navy);color:#fff;padding:8px 12px;text-align:left;font-size:20px}
.audit th:first-child{border-radius:10px 0 0 10px}.audit th:last-child{border-radius:0 10px 10px 0}
.audit td{background:#fff;padding:9px 12px;border-top:2px solid #E3E8F0;border-bottom:2px solid #E3E8F0}
.audit td:first-child{border-left:2px solid #E3E8F0;border-radius:10px 0 0 10px;width:90px}
.audit td:last-child{border-right:2px solid #E3E8F0;border-radius:0 10px 10px 0;color:#9B2C12;font-weight:900}
.audit tr.hl td{background:#FFF8D6}
.tips{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tip{background:#fff;border-radius:18px;padding:16px 18px;display:flex;gap:14px;align-items:center;border:3px solid #E0E6EF;font-size:23px;font-weight:900;color:var(--navy)}
.tip b{flex:0 0 52px;height:52px;border-radius:50%;background:var(--orange);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center}
.tip em{display:block;font-style:normal;font-weight:500;color:var(--red);font-size:19px;margin-top:4px}

/* 缺失 */
.ng-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ng{position:relative;background:#fff;border:3px solid #F3C3B5;border-radius:14px;padding:10px 90px 10px 60px;font-size:21px;font-weight:900;color:#3A2A26;min-height:58px;display:flex;align-items:center}
.ng b{position:absolute;left:12px;top:50%;margin-top:-19px;width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
.ng .pill{position:absolute;right:10px;top:50%;margin-top:-15px;font-size:16px}
.ng:last-child{grid-column:1/3;justify-self:center;width:560px}
.three-el{display:flex;gap:20px;margin-bottom:24px}
.el{flex:1;border-radius:18px;padding:14px;text-align:center;font-size:20px;color:#fff}
.el b{display:block;font-size:38px}
.e1{background:var(--c814)}.e2{background:var(--teal)}.e3{background:var(--red)}
.ncr{background:#fff;border:3px solid #DCE3EE;border-radius:18px;padding:14px 22px}
.ncr-h{font-weight:900;color:var(--navy);font-size:22px}
.ncr p{font-size:23px;line-height:1.75;margin:6px 0 0}
.ncr mark{padding:2px 4px;border-radius:6px}
.m1{background:#DCE8FF}.m2{background:#D5F2EC}.m3{background:#FFDCD3}

/* 案例 */
.timeline{border-left:6px solid var(--navy);margin-left:12px;padding-left:22px}
.ev{position:relative;background:#fff;border-radius:12px;padding:10px 16px;margin-bottom:12px;font-size:22px;border:2px solid #E0E6EF}
.ev::before{content:"";position:absolute;left:-36px;top:16px;width:20px;height:20px;border-radius:50%;background:var(--navy);border:4px solid var(--cream)}
.ev b{color:var(--navy);margin-right:12px}
.ev.bad{border-color:#F3C3B5;background:#FFF5F2}.ev.bad::before{background:var(--red)}
.fix{margin-top:16px;background:#F1FBF8;border:3px solid #9ED9CB;border-radius:16px;padding:10px 16px}
.fix-h{font-weight:900;font-size:22px;color:#145C52;margin-bottom:2px}
.case2{display:flex;align-items:center;gap:14px;margin:16px 0 30px}
.c2box{flex:1;background:#fff;border:3px solid #DCE3EE;border-radius:18px;text-align:center;padding:18px 6px;font-size:23px;font-weight:900;color:var(--navy);line-height:1.5}
.c2box i{display:block;font-style:normal;font-size:46px}
.c2box.bad{border-color:#F3C3B5;background:#FFF5F2}
.c2arrow{font-size:40px;color:var(--red)}

/* 小測驗 */
.quiz{text-align:center}
.q{display:inline-block;background:var(--purple);color:#fff;border-radius:22px;padding:16px 28px;font-size:30px;font-weight:900;line-height:1.5}
.q b{color:#FFE066}
.opts{display:flex;gap:24px;justify-content:center;margin:26px 0 12px}
.opt{width:240px;background:#fff;border:4px solid #DCE3EE;border-radius:20px;padding:12px;font-size:28px;font-weight:900;color:var(--navy)}
.opt b{display:inline-block;width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;margin-right:10px;line-height:46px}
.opt.ans.reveal{border-color:#22A06B;background:#E6F8EF;box-shadow:0 0 0 8px rgba(34,160,107,.2)}
.opt.ans.reveal b{background:#22A06B}
.countdown{font-size:30px;font-weight:900;color:var(--red)}
.explain{display:inline-block;margin-top:8px;background:#E6F8EF;border:3px solid #22A06B;border-radius:16px;padding:10px 22px;font-size:24px;font-weight:900;color:#0F5C3A;line-height:1.5}
.explain small{font-weight:500;font-size:18px;color:#2D6B4F}

/* 總結 */
.sum{list-style:none;padding:0;margin:0}
.sum li{font-size:24px;font-weight:900;color:var(--navy);background:#fff;border-radius:14px;padding:5px 16px;margin-bottom:8px;border:2px solid #E0E6EF}
.sum .pill{margin-right:14px;font-size:20px;min-width:70px;text-align:center}
.motto{margin:12px auto 0;width:860px;text-align:center;font-size:28px;font-weight:900;color:#fff;background:linear-gradient(90deg,var(--teal),var(--c814));border-radius:18px;padding:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="viewport" id="viewport">
    <div id="stage">
      <div class="topbar"><span class="logo">ISMS</span><span class="chap-label" id="chapLabel"></span><span class="brand">ISO/IEC 27001:2022 · 持續性 Continuity</span></div>
      <div class="progress" id="progress"></div>
      <div id="scenes"></div>

      <!-- 角色：依 characters/ 內設定圖切出的表情畫格 -->
      <div class="char" id="allan" data-who="allan" data-poses="smile talk laugh think scratch shock point wink worry">
        <div class="nameplate">Allan Lo 講師</div>
      </div>
      <div class="char" id="arale" data-who="arale" data-poses="think talk talk_c laugh shock ask cry wink cheer">
        <div class="nameplate">助教 阿拉蕾</div>
      </div>
      <div class="fx" id="fxA"></div><div class="fx" id="fxR"></div>

      <div class="sub empty" id="sub"><span class="who" id="who"></span><span id="subText"></span></div>
    </div>
    <button class="startbtn" id="startBtn" type="button"><span>▶ 開始上課</span></button>
  </div>

  <div class="controls">
    <button id="prevBtn" title="上一頁 (←)">⏮</button>
    <button id="playBtn" title="播放/暫停 (空白鍵)">▶</button>
    <button id="nextBtn" title="下一頁 (→)">⏭</button>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="播放進度">
    <span class="time" id="time">0:00 / 0:00</span>
    <button id="ccBtn" class="on" title="字幕 (C)">字幕</button>
    <button id="fsBtn" title="全螢幕 (F)">⛶</button>
  </div>
  <div class="chapters" id="chapters"></div>
  <div class="note">講者：Q 版 Allan Lo 講師（台灣男聲 zh-TW-YunJhe）、助教阿拉蕾（zh-TW-HsiaoYu）。快捷鍵：空白鍵 播放/暫停、← → 換頁、C 字幕、F 全螢幕。</div>
</div>

<audio id="audio" src="audio/narration.mp3" preload="auto"></audio>
<script src="deck.js"></script>
<script src="timeline.js"></script>
<script>
(() => {
  const RENDER = /[?&]render/.test(location.search);
  if (RENDER) document.body.classList.add("render");
  const D = window.DECK, T = window.TIMELINE;
  const $ = (id) => document.getElementById(id);
  const scenesEl = $("scenes");

  // 建立各頁 DOM
  const scenes = D.scenes.map((sc, i) => {
    const el = document.createElement("div");
    el.className = "scene" + (sc.layout ? " " + sc.layout : "");
    el.innerHTML = sc.html;
    scenesEl.appendChild(el);
    const tl = T.scenes[i];
    const items = [...el.querySelectorAll("[data-s]")].map((node) => {
      const step = +node.dataset.s;
      const at = step === 0 ? tl.start + 0.15 : (tl.lines[step] ? tl.lines[step].start : tl.start);
      return { node, at, a: node.dataset.a || "fade", bars: [...node.querySelectorAll(".g-bar span")] };
    });
    return { sc, tl, el, items };
  });

  const clamp = (x) => Math.max(0, Math.min(1, x));
  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  const easeBack = (x) => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

  function applyAnim(it, t) {
    const p = clamp((t - it.at) / 0.55), e = easeOut(p), s = it.node.style;
    let tr = "", op = e;
    switch (it.a) {
      case "pop": tr = `scale(${0.3 + 0.7 * easeBack(p)})`; op = clamp(p * 2.5); break;
      case "up": tr = `translateY(${(1 - e) * 40}px)`; break;
      case "left": tr = `translateX(${(1 - e) * -60}px)`; break;
      case "right": tr = `translateX(${(1 - e) * 60}px)`; break;
      case "grow": s.clipPath = p >= 1 ? "" : `inset(0 ${(1 - e) * 100}% 0 0)`; op = p > 0 ? 1 : 0; break;
    }
    if (it.a !== "grow") s.transform = tr;
    s.opacity = op;
    if (it.bars.length) it.bars.forEach((b) => (b.style.transform = `scaleY(${easeOut(clamp((t - it.at - 0.3) / 1.2))})`, b.style.transformOrigin = "50% 100%"));
  }

  // 角色畫格：A = Allan、R = 阿拉蕾。talk 姿勢會在張嘴/閉嘴兩格之間切換
  const chars = {
    A: { el: $("allan"), fx: $("fxA"), fxPos: [24, 452], idle: "smile", talk: ["smile", "talk"],
         emo: { happy: "laugh", jump: "laugh", shock: "shock" } },
    R: { el: $("arale"), fx: $("fxR"), fxPos: [1214, 452], idle: "think", talk: ["talk_c", "talk"],
         emo: { happy: "wink", jump: "cheer", shock: "shock" } },
  };
  const imgLoads = [];
  for (const k in chars) {
    const c = chars[k], who = c.el.dataset.who;
    c.img = {};
    c.el.dataset.poses.split(" ").forEach((p) => {
      const im = new Image();
      im.src = `characters/${who}_${p}.png`; im.alt = "";
      imgLoads.push(im.decode().catch(() => {}));
      c.el.insertBefore(im, c.el.firstChild);
      c.img[p] = im;
    });
    c.cur = null;
  }
  window.charsReady = Promise.all(imgLoads);
  const show = (c, p) => { if (c.cur === p) return; if (c.cur) c.img[c.cur].classList.remove("on"); c.img[p].classList.add("on"); c.cur = p; };
  // 偽隨機嘴型（讓說話節奏不規則）
  const mouthOpen = (t, seed) => Math.sin(t * 17 + seed) + Math.sin(t * 11.3 + seed * 2) * 0.8 > 0.1;
  const POSE_HOLD = 1.8; // 台詞指定的表情先停留幾秒，之後回到說話嘴型

  let curScene = -1;
  function renderAt(t) {
    let si = 0;
    for (let i = 0; i < scenes.length; i++) if (scenes[i].tl.start <= t) si = i;
    const S = scenes[si];
    if (si !== curScene) {
      scenes.forEach((s, i) => s.el.classList.toggle("active", i === si));
      $("chapLabel").textContent = S.sc.chapter;
      document.querySelectorAll("#chapters button").forEach((b, i) => b.classList.toggle("cur", i === si));
      curScene = si;
    }
    // 換頁轉場
    const sp = easeOut(clamp((t - S.tl.start) / 0.45));
    S.el.style.opacity = sp; S.el.style.transform = `translateY(${(1 - sp) * 18}px)`;
    S.items.forEach((it) => applyAnim(it, t));
    // 小測驗：公布答案
    const ans = S.el.querySelector(".opt.ans");
    if (ans) ans.classList.toggle("reveal", S.tl.lines[2] && t >= S.tl.lines[2].start);

    // 目前台詞
    let li = -1;
    S.tl.lines.forEach((l, i) => { if (l.start <= t) li = i; });
    const L = li >= 0 ? S.tl.lines[li] : null, Ld = li >= 0 ? S.sc.lines[li] : null;
    const speaking = L && t < L.end ? L.s : null;
    const sub = $("sub");
    if (Ld && t < S.tl.end - 0.2) {
      sub.className = "sub" + (Ld.s === "R" ? " r" : "") + (subsOn ? "" : " empty");
      $("who").textContent = Ld.s === "A" ? "Allan 老師" : "阿拉蕾";
      $("subText").textContent = Ld.t;
    } else sub.className = "sub empty";

    for (const k in chars) {
      const c = chars[k], talk = speaking === k, mine = Ld && Ld.s === k;
      const lt = L ? t - L.start : 0;
      const emo = mine && t < L.end + 0.6 ? Ld.e : null;
      let y = Math.sin(t * 2.2 + (k === "A" ? 0 : 1.7)) * 2.5, x = 0, r = 0, sc = 1;
      if (talk) y -= Math.abs(Math.sin(t * 6.5)) * 5, r = Math.sin(t * 3.1) * 1.6;
      if (emo === "jump") y -= Math.abs(Math.sin(lt * 7)) * 22;
      if (emo === "shock" && lt < 1.2) x = Math.sin(t * 60) * 4, sc = 1.04;
      c.el.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${sc})`;
      // 選擇畫格：台詞指定 p（姿勢）> e（情緒）> 說話嘴型；聽者可用 r 指定反應
      let pose;
      const want = mine ? (Ld.p || c.emo[Ld.e]) : (Ld && !mine && Ld.r && t < L.end + 0.4 ? Ld.r : null);
      if (mine && want && (lt < POSE_HOLD || !talk)) pose = want;
      else if (talk) pose = c.talk[mouthOpen(t, k === "A" ? 0 : 3) ? 1 : 0];
      else pose = want || c.idle;
      show(c, pose);
      c.el.style.filter = talk ? "drop-shadow(0 0 8px rgba(255,196,70,.85))" : "none";
      // 特效
      const fxOn = emo && lt < 1.6;
      c.fx.textContent = fxOn ? ({ jump: "✨", happy: "💯", shock: "💦" }[emo] || "") : "";
      c.fx.style.left = c.fxPos[0] + Math.sin(t * 5) * 6 + "px";
      c.fx.style.top = c.fxPos[1] - clamp(lt / 1.2) * 30 + "px";
      c.fx.style.opacity = fxOn ? 1 - clamp((lt - 1.1) / 0.5) : 0;
    }
    $("progress").style.width = (t / T.duration) * 100 + "%";
  }
  window.renderAt = renderAt;
  window.DURATION = T.duration;

  // ---------- 播放器 ----------
  let subsOn = true;
  const audio = $("audio"), seek = $("seek"), playBtn = $("playBtn");
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  function fit() {
    if (RENDER) return;
    const w = $("viewport").clientWidth;
    $("stage").style.transform = `scale(${w / 1280})`;
  }
  addEventListener("resize", fit); fit();

  // 無法載入音檔時，改用內部時鐘（仍可看動畫與字幕）
  let fallback = false, fbStart = 0, fbBase = 0, fbPlaying = false;
  audio.addEventListener("error", () => { fallback = true; });
  const now = () => fallback ? (fbPlaying ? fbBase + (performance.now() - fbStart) / 1000 : fbBase) : audio.currentTime;
  const playing = () => fallback ? fbPlaying : !audio.paused;
  function play() {
    $("startBtn").style.display = "none";
    if (fallback) { fbStart = performance.now(); fbPlaying = true; }
    else audio.play().catch(() => { fallback = true; fbBase = audio.currentTime; play(); });
  }
  function pause() { if (fallback) { fbBase = now(); fbPlaying = false; } else audio.pause(); }
  function goto(t) {
    t = Math.max(0, Math.min(T.duration - 0.05, t));
    if (fallback) { fbBase = t; fbStart = performance.now(); } else audio.currentTime = t;
    renderAt(t);
  }
  const sceneIdx = (t) => { let k = 0; T.scenes.forEach((s, i) => { if (s.start <= t + 0.01) k = i; }); return k; };
  const jump = (d) => { const k = Math.max(0, Math.min(T.scenes.length - 1, sceneIdx(now()) + d)); goto(T.scenes[k].start); };

  $("startBtn").onclick = play;
  playBtn.onclick = () => (playing() ? pause() : play());
  $("prevBtn").onclick = () => jump(-1);
  $("nextBtn").onclick = () => jump(1);
  $("ccBtn").onclick = () => { subsOn = !subsOn; $("ccBtn").classList.toggle("on", subsOn); };
  $("fsBtn").onclick = () => { const v = $("viewport"); document.fullscreenElement ? document.exitFullscreen() : v.requestFullscreen && v.requestFullscreen(); };
  document.addEventListener("fullscreenchange", () => setTimeout(fit, 50));
  seek.oninput = () => goto((seek.value / 1000) * T.duration);
  addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" && e.key !== " ") return;
    if (e.key === " ") { e.preventDefault(); playBtn.click(); }
    else if (e.key === "ArrowRight") jump(1);
    else if (e.key === "ArrowLeft") jump(-1);
    else if (e.key.toLowerCase() === "c") $("ccBtn").click();
    else if (e.key.toLowerCase() === "f") $("fsBtn").click();
  });
  const chapWrap = $("chapters");
  D.scenes.forEach((sc, i) => {
    const b = document.createElement("button");
    b.textContent = `${i + 1}. ${sc.chapter.replace(/^(作業重點|實務案例)./, "$1 ")}`;
    b.onclick = () => goto(T.scenes[i].start);
    chapWrap.appendChild(b);
  });

  function loop() {
    const t = now();
    if (fallback && fbPlaying && t >= T.duration) { fbPlaying = false; fbBase = T.duration - 0.05; }
    renderAt(Math.min(t, T.duration - 0.01));
    playBtn.textContent = playing() ? "⏸" : "▶";
    if (document.activeElement !== seek) seek.value = Math.round((t / T.duration) * 1000);
    $("time").textContent = `${fmt(t)} / ${fmt(T.duration)}`;
    requestAnimationFrame(loop);
  }
  renderAt(0.9);
  if (!RENDER) requestAnimationFrame(loop);
})();
</script>
</body>
</html>
